stages: [build, test]

variables:
  CUDA_IMAGE: "nvidia/cuda:12.4.1-devel-ubuntu22.04"

build:
  stage: build
  image: $CUDA_IMAGE
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake >/dev/null
  script:
    - cmake -B build -DCMAKE_CUDA_ARCHITECTURES=75 -DCMAKE_BUILD_TYPE=Release
    - cmake --build build -j
  artifacts:
    paths: [build/]
    expire_in: 1 hour

test:gpu:
  stage: test
  image: $CUDA_IMAGE
  tags: [gpu]
  needs: [build]
  allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake >/dev/null
  script:
    - cd build && ctest --output-on-failure
